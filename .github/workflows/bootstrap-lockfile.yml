name: Bootstrap npm lockfile (one-time)

on:
  push:
    branches: [feat/cp1-5-observability]
    paths:
      - .github/workflows/bootstrap-lockfile.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cp1-5-observability
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Generate npm lockfile using registry resolution
        working-directory: examples/nestjs-monolith
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to feature branch
        run: |
          git add examples/nestjs-monolith/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "build: lock NestJS testbed dependencies for reproducible installs"
          git push origin HEAD:feat/cp1-5-observability
